name: Dostlik News Bot Auto Run

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: newsbot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kodlarni yuklash
        uses: actions/checkout@v4

      - name: Python muhitini sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botni ishga tushirish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_DB }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_DB }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_DB }}
          TELEGRAM_ADMIN_IDS: ${{ secrets.TELEGRAM_ADMIN_IDS }}
          REQUIRE_IMAGE: '0'
          # Kanal logotipi bo'lsa, quyidagi qatorni yoqing (# ni olib tashlang) va havolani qo'ying:
          # DEFAULT_IMAGE_URL: 'https://SIZNING_RASM_HAVOLASI.jpg'
        run: python main.py

      - name: Baza fayllarini saqlash
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_news.json daily_state.json ads.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "O'zgarish yo'q."
          else
            git commit -m "Auto-update database files"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
